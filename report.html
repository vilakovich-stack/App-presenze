<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aretusa · Relazione privata</title><style>body{font:15px system-ui;background:#f1f5f9;color:#0f172a;margin:0;padding:16px}main{max-width:1050px;margin:auto;background:white;border-radius:20px;padding:24px}h1{color:#1d4ed8}input,button{padding:13px;border-radius:10px;border:1px solid #cbd5e1}button{background:#1d4ed8;color:white;font-weight:bold;cursor:pointer}.hide{display:none}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid #cbd5e1;padding:7px}th{background:#dbeafe}.yes{color:#047857}.no,.zero{color:#b91c1c}.zero{background:#fee2e2}.day{padding:12px;border:1px solid #e2e8f0;border-radius:12px;margin:10px 0}summary{cursor:pointer;font-weight:bold}.muted{color:#64748b}@media print{body{background:white;padding:0}main{padding:0}#gate,.actions{display:none!important}.day{break-inside:avoid}@page{size:A4 landscape}}</style></head><body><main><h1>ASD PALLAMANO ARETUSA</h1><p class="muted">Relazione presenze · Accesso riservato</p><div id="gate"><p>Inserisci la password comunicata dal responsabile.</p><form id="unlock"><input id="password" type="password" required placeholder="Password del report" autocomplete="off"><button>Apri relazione</button></form><p id="message" role="alert"></p></div><div id="content" class="hide"></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('unlock').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('message');msg.textContent='Verifica in corso...';try{const id=new URLSearchParams(location.search).get('id');const r=await fetch('/api/reports?action=unlock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.error||'Accesso negato');document.getElementById('password').value='';document.getElementById('gate').classList.add('hide');render(data.report);}catch(err){msg.textContent=err.message;}};
function render(d){const el=document.getElementById('content');el.classList.remove('hide');const rows=d.rows||[],dates=d.dates||[];const p=rows.reduce((n,r)=>n+r.present,0),a=rows.reduce((n,r)=>n+r.absent,0);let html=`<h2>Diario ${esc(d.month)}</h2><p>${esc(d.team)} · ${dates.length} giornate · ${p} presenze · ${a} assenze · ${p+a?Math.round(100*p/(p+a))+'%':'—'}</p><p class="muted">✓ presente · ✕ assente · — nessuna registrazione. Rosso: nessuna presenza nel periodo.</p><div class="actions"><button onclick="window.print()">Stampa / Salva PDF</button></div>`;for(const team of [...new Set(rows.map(x=>x.team))]){const members=rows.filter(x=>x.team===team);html+=`<h2>${esc(team)}</h2><div class="scroll"><table><thead><tr><th>Giocatore</th>${dates.map(x=>`<th>${esc(x.slice(5))}</th>`).join('')}<th>P</th><th>A</th><th>%</th></tr></thead><tbody>${members.map(x=>`<tr class="${x.present===0?'zero':''}"><td>${esc(x.name)}</td>${x.statuses.map(st=>`<td class="${st==='present'?'yes':st==='absent'?'no':''}">${st==='present'?'✓':st==='absent'?'✕':'—'}</td>`).join('')}<td>${x.present}</td><td>${x.absent}</td><td>${x.rate===null?'—':x.rate+'%'}</td></tr>`).join('')}</tbody></table></div>`;}
html+='<h2>Dettaglio giornaliero</h2>';dates.forEach((date,i)=>{const present=rows.filter(x=>x.statuses[i]==='present'),absent=rows.filter(x=>x.statuses[i]==='absent');html+=`<details class="day"><summary>${esc(date)} · ${present.length} presenti · ${absent.length} assenti</summary><p class="yes"><b>Presenti:</b> ${present.map(x=>esc(x.name)).join(', ')||'Nessuno'}</p><p class="no"><b>Assenti:</b> ${absent.map(x=>esc(x.name)).join(', ')||'Nessuno'}</p></details>`;});el.innerHTML=html;}
</script></body></html>
