<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestione Presenze Giocatori Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        
        /* Modern Navigation */
        .tab-active { color: #2563eb; font-weight: 600; }
        .tab-active i { background-color: #eff6ff; padding: 0.4rem 1.2rem; border-radius: 9999px; }
        .tab-inactive { color: #6b7280; font-weight: 500; }
        .tab-inactive i { padding: 0.4rem 1.2rem; }
        
        .avatar-img { object-fit: cover; width: 100%; height: 100%; border-radius: 50%; }
        
        /* Smooth Toggles */
        .status-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .status-present { background-color: #10b981; color: white; border-color: #10b981; transform: scale(1.05); }
        .status-absent { background-color: #ef4444; color: white; border-color: #ef4444; transform: scale(1.05); }
        .status-none { background-color: #f3f4f6; color: #9ca3af; border-color: #e5e7eb; }
        
        ::-webkit-scrollbar { display: none; }

        /* Glassmorphism Modals */
        .modal-backdrop { backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); background-color: rgba(0, 0, 0, 0.4); }
        
        /* Toast Notifications */
        #toastContainer { pointer-events: none; }
        .toast { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); transform: translateY(100%); opacity: 0; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Sync Banner */
        #cloudSyncBanner { transition: top 0.3s ease-in-out; }
        .banner-visible { top: 0; }
        .banner-hidden { top: -50px; }
        
        /* Animations */
        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .badge-new { animation: pulse-soft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="text-gray-800 flex flex-col h-screen overflow-hidden relative">

    <!-- Sync Banner -->
    <div id="cloudSyncBanner" class="fixed left-0 w-full bg-blue-600 text-white text-xs font-semibold text-center py-1.5 z-50 banner-visible shadow-md flex justify-center items-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up animate-bounce"></i> <span id="syncText">Sincronizzazione in corso...</span>
    </div>

    <!-- Header -->
    <header class="bg-white text-gray-800 shadow-sm z-10 p-4 pt-8 pb-3 border-b border-gray-100">
        <div class="max-w-3xl mx-auto flex justify-between items-end">
            <div>
                <h1 class="text-xl font-bold flex items-center gap-2 text-gray-900">
                    <div class="bg-blue-600 text-white w-8 h-8 rounded-lg flex items-center justify-center text-sm shadow-sm"><i class="fa-solid fa-clipboard-check"></i></div>
                    Aretusa Presenze
                </h1>
            </div>
            <div id="currentDateDisplay" class="text-xs font-semibold text-gray-500 bg-gray-100 px-3 py-1.5 rounded-full"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto pb-24 w-full max-w-3xl mx-auto" id="mainContainer">
        
        <!-- View 1: Appello (Roll Call) -->
        <div id="viewAppello" class="p-4 space-y-4">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Seleziona Squadra</label>
                <select id="teamSelector" class="w-full bg-gray-50 border border-gray-200 text-gray-900 font-semibold text-base rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-3 transition-colors">
                    <option value="">Caricamento...</option>
                </select>
            </div>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Data Appello</label>
                <input type="date" id="attendanceDate" class="bg-gray-50 border border-gray-200 text-gray-900 font-semibold text-sm rounded-xl focus:ring-blue-500 focus:border-blue-500 p-2 outline-none">
            </div>

            <!-- Stats Bar & Mark All -->
            <div id="appelloControls" class="hidden flex justify-between items-center px-1">
                <div class="flex gap-3 text-sm font-semibold">
                    <span class="text-green-600"><i class="fa-solid fa-check"></i> <span id="countPresent">0</span></span>
                    <span class="text-red-500"><i class="fa-solid fa-xmark"></i> <span id="countAbsent">0</span></span>
                    <span class="text-gray-400"><i class="fa-regular fa-circle"></i> <span id="countNone">0</span></span>
                </div>
                <button onclick="markAllPresent()" class="text-sm bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg font-semibold transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-check-double"></i> Tutti Presenti
                </button>
            </div>

            <!-- Players List -->
            <div id="playersList" class="space-y-3 mt-2">
                <div class="text-center text-gray-400 mt-12 py-12 bg-white rounded-2xl border border-gray-100 border-dashed">
                    <i class="fa-solid fa-users text-4xl mb-3 text-gray-300"></i>
                    <p class="font-medium">Seleziona una squadra per l'appello</p>
                </div>
            </div>
        </div>

        <!-- View 2: Storico (History) -->
        <div id="viewStorico" class="p-4 space-y-4 hidden">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Mese</label>
                    <select id="monthSelector" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm font-semibold rounded-xl p-2.5 outline-none">
                        <option value="01">Gennaio</option>
                        <option value="02">Febbraio</option>
                        <option value="03">Marzo</option>
                        <option value="04">Aprile</option>
                        <option value="05">Maggio</option>
                        <option value="06">Giugno</option>
                        <option value="07">Luglio</option>
                        <option value="08">Agosto</option>
                        <option value="09">Settembre</option>
                        <option value="10">Ottobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Dicembre</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Anno</label>
                    <select id="yearSelector" class="w-full bg-gray-50 border border-gray-200 text-gray-900 text-sm font-semibold rounded-xl p-2.5 outline-none">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <div class="col-span-2">
                     <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Filtra per Squadra</label>
                     <div class="flex gap-2">
                         <select id="historyTeamSelector" class="flex-1 bg-gray-50 border border-gray-200 text-gray-900 text-sm font-semibold rounded-xl p-2.5 outline-none">
                            <option value="ALL">Tutte le squadre</option>
                         </select>
                         <button onclick="exportToCSV()" class="bg-gray-900 hover:bg-black text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2 transition-colors shadow-sm">
                             <i class="fa-solid fa-download"></i> CSV
                         </button>
                     </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-600">
                        <thead class="text-xs text-gray-400 uppercase bg-gray-50 border-b border-gray-100 tracking-wider">
                            <tr>
                                <th scope="col" class="px-4 py-3">Giocatore</th>
                                <th scope="col" class="px-4 py-3 text-center"><i class="fa-solid fa-check text-green-500"></i></th>
                                <th scope="col" class="px-4 py-3 text-center"><i class="fa-solid fa-xmark text-red-400"></i></th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- View 3: Giocatori (Roster) -->
        <div id="viewGiocatori" class="p-4 space-y-4 hidden">
            <div class="flex justify-between items-center mb-1">
                <h2 class="text-xl font-bold text-gray-900">Anagrafica</h2>
                <button onclick="openPlayerModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl shadow-sm transition-transform active:scale-95 flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-plus"></i> Nuovo
                </button>
            </div>
            
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
                <div class="flex gap-2">
                    <select id="rosterTeamSelector" class="w-1/2 bg-gray-50 border border-gray-200 text-gray-900 text-sm font-semibold rounded-xl focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none">
                        <option value="ALL">Tutte</option>
                    </select>
                    <div class="relative w-1/2">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <i class="fa-solid fa-search text-gray-400"></i>
                        </div>
                        <input type="text" id="playerSearchInput" class="bg-gray-50 border border-gray-200 text-gray-900 text-sm font-semibold rounded-xl focus:ring-blue-500 focus:border-blue-500 block w-full pl-9 p-2.5 outline-none" placeholder="Cerca...">
                    </div>
                </div>
            </div>

            <div id="rosterList" class="space-y-3 mt-4 pb-4">
                <!-- Populated by JS -->
            </div>
        </div>

        <!-- View 4: Squadre (Dashboard) -->
        <div id="viewSquadre" class="p-4 space-y-4 hidden">
             <div class="flex justify-between items-center mb-1">
                <h2 class="text-xl font-bold text-gray-900">Dashboard Squadre</h2>
                <span class="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded-full" id="totalPlayersBadge">0 Giocatori</span>
            </div>
            <div id="teamsDashboardContainer" class="grid grid-cols-1 gap-4 pb-4">
                <!-- Populated by JS -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-200 z-10 pb-safe">
        <div class="max-w-3xl mx-auto flex px-2">
            <button onclick="switchTab('appello')" id="tabAppello" class="flex-1 py-3 flex flex-col items-center justify-center gap-1 tab-active focus:outline-none transition-colors">
                <i class="fa-solid fa-list-check text-lg"></i>
                <span class="text-[10px] uppercase tracking-wider">Appello</span>
            </button>
            <button onclick="switchTab('storico')" id="tabStorico" class="flex-1 py-3 flex flex-col items-center justify-center gap-1 tab-inactive focus:outline-none transition-colors">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] uppercase tracking-wider">Storico</span>
            </button>
            <button onclick="switchTab('giocatori')" id="tabGiocatori" class="flex-1 py-3 flex flex-col items-center justify-center gap-1 tab-inactive focus:outline-none transition-colors relative">
                <i class="fa-solid fa-users text-lg"></i>
                <span class="text-[10px] uppercase tracking-wider">Giocatori</span>
                <span id="navBadgeNew" class="hidden absolute top-1 right-1/4 bg-red-500 w-2.5 h-2.5 rounded-full border-2 border-white"></span>
            </button>
            <button onclick="switchTab('squadre')" id="tabSquadre" class="flex-1 py-3 flex flex-col items-center justify-center gap-1 tab-inactive focus:outline-none transition-colors">
                <i class="fa-solid fa-shield-halved text-lg"></i>
                <span class="text-[10px] uppercase tracking-wider">Squadre</span>
            </button>
        </div>
    </nav>

    <!-- Photo Modal -->
    <div id="photoModal" class="fixed inset-0 modal-backdrop z-50 hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl transform transition-all flex flex-col items-center relative">
            <button onclick="closePhotoModal()" class="absolute top-4 right-4 w-8 h-8 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 flex items-center justify-center transition-colors">
                <i class="fa-solid fa-times"></i>
            </button>
            
            <h3 class="text-xl font-bold text-gray-900 mb-1 mt-2" id="modalPlayerName">Nome</h3>
            <p class="text-sm font-semibold text-blue-600 mb-6 bg-blue-50 px-3 py-1 rounded-full" id="modalPlayerTeam">Squadra</p>
            
            <div class="w-32 h-32 rounded-full border-4 border-blue-50 bg-gray-50 flex items-center justify-center overflow-hidden mb-6 relative group shadow-inner">
                <img id="modalPreviewImg" class="avatar-img hidden" src="" alt="Preview">
                <i id="modalPreviewIcon" class="fa-solid fa-camera text-4xl text-gray-300"></i>
            </div>
            
            <div class="w-full space-y-3">
                <label for="cameraInput" class="w-full flex items-center justify-center gap-2 bg-gray-900 hover:bg-black text-white font-semibold py-3 px-4 rounded-xl cursor-pointer transition-transform active:scale-95 shadow-md">
                    <i class="fa-solid fa-camera"></i>
                    Scatta / Scegli Foto
                </label>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
                
                <button id="removePhotoBtn" onclick="removePhoto()" class="w-full flex items-center justify-center gap-2 bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-3 px-4 rounded-xl transition-colors hidden">
                    <i class="fa-solid fa-trash-can"></i>
                    Rimuovi
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas for Image Compression -->
    <canvas id="compressCanvas" class="hidden"></canvas>

    <!-- Player Form Modal -->
    <div id="playerModal" class="fixed inset-0 modal-backdrop z-50 hidden flex items-end sm:items-center justify-center sm:p-4 transition-opacity">
        <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md p-6 shadow-2xl transform transition-all flex flex-col max-h-[90vh] overflow-y-auto pb-safe">
            <div class="w-full flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-gray-900" id="playerModalTitle">Aggiungi Giocatore</h3>
                <button onclick="closePlayerModal()" class="w-8 h-8 bg-gray-100 rounded-full text-gray-500 hover:bg-gray-200 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-times"></i>
                </button>
            </div>
            
            <form id="playerForm" class="space-y-4" onsubmit="savePlayer(event)">
                <input type="hidden" id="editPlayerId">
                <input type="hidden" id="editPlayerIsNew">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Nome *</label>
                        <input type="text" id="playerName" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Cognome *</label>
                        <input type="text" id="playerSurname" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Squadra *</label>
                    <input type="text" id="playerTeam" required list="teamOptions" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all uppercase" placeholder="Es. U14A">
                    <datalist id="teamOptions"></datalist>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Genitore / Tutore</label>
                    <input type="text" id="playerGenitore" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all" placeholder="Nome del genitore">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Telefono</label>
                    <input type="tel" id="playerPhone" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all" placeholder="Es. 333 1234567">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Data Nascita</label>
                        <input type="date" id="playerBirth" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-1">Iscrizione</label>
                        <input type="date" id="playerEntry" required class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 font-medium focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
                    </div>
                </div>

                <div class="pt-6 flex gap-3">
                    <button type="button" id="deletePlayerBtn" onclick="deletePlayer()" class="hidden w-14 bg-red-50 text-red-600 font-bold rounded-xl hover:bg-red-100 transition-colors flex items-center justify-center"><i class="fa-solid fa-trash-can"></i></button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-3.5 rounded-xl hover:bg-blue-700 transition-transform active:scale-95 shadow-md flex justify-center items-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Salva Giocatore
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-24 left-0 w-full flex flex-col items-center gap-2 z-50"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // TUS CREDENCIALES DE FIREBASE (NO TOCAR)
        const firebaseConfig = {
            apiKey: "AIzaSyAEzLuN2TT77foODRGwAo3UY16VolP9nzY",
            authDomain: "gestione-presenze-b52c7.firebaseapp.com",
            databaseURL: "https://gestione-presenze-b52c7-default-rtdb.firebaseio.com",
            projectId: "gestione-presenze-b52c7",
            storageBucket: "gestione-presenze-b52c7.firebasestorage.app",
            messagingSenderId: "8099106330",
            appId: "1:8099106330:web:a69dfd06a4662bd8474ba3"
        };
        
        // Init Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // State
        let players = [];
        let attendance = {}; 
        let currentEditingPlayerId = null;

        window.onload = async () => {
            initUI();
            setupEventListeners();
            
            try {
                await signInAnonymously(auth);
                initCloudData();
            } catch (error) {
                console.error("Auth Error:", error);
                document.getElementById('syncText').textContent = "Errore di connessione";
                document.getElementById('cloudSyncBanner').classList.replace('bg-blue-600', 'bg-red-500');
            }
        };

        const getPlayersPath = () => `players`; 
        const getAttendancePath = () => `attendance`; 

        function initCloudData() {
            // Listen for Players Collection
            onSnapshot(collection(db, getPlayersPath()), async (snapshot) => {
                players = [];
                let hasNew = false;
                snapshot.forEach(doc => {
                    const p = doc.data();
                    players.push(p);
                    if(p.isNew) hasNew = true;
                });
                
                // Update new badge
                const badge = document.getElementById('navBadgeNew');
                if(hasNew) badge.classList.remove('hidden');
                else badge.classList.add('hidden');

                populateTeamSelectors();
                renderViews();
                hideSyncBanner();
            });

            // Listen for Attendance Collection
            onSnapshot(collection(db, getAttendancePath()), async (snapshot) => {
                attendance = {};
                snapshot.forEach(doc => {
                    attendance[doc.id] = doc.data().records || {};
                });
                renderViews();
            });
        }

        function hideSyncBanner() {
            const banner = document.getElementById('cloudSyncBanner');
            setTimeout(() => {
                banner.classList.replace('banner-visible', 'banner-hidden');
            }, 1000);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            let icon = type === 'success' ? '<i class="fa-solid fa-circle-check text-green-500"></i>' : '<i class="fa-solid fa-circle-exclamation text-red-500"></i>';
            
            toast.className = `bg-gray-900/95 backdrop-blur text-white text-sm font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-3 toast pointer-events-auto`;
            toast.innerHTML = `${icon} ${message}`;
            
            container.appendChild(toast);
            
            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });
            
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function renderViews() {
            if (!document.getElementById('viewAppello').classList.contains('hidden')) renderAppelloList();
            if (!document.getElementById('viewStorico').classList.contains('hidden')) renderStorico();
            if (!document.getElementById('viewGiocatori').classList.contains('hidden')) renderGiocatori();
            if (!document.getElementById('viewSquadre').classList.contains('hidden')) renderSquadreDashboard();
        }

        function initUI() {
            const today = new Date();
            const options = { weekday: 'short', day: 'numeric', month: 'short' };
            document.getElementById('currentDateDisplay').textContent = today.toLocaleDateString('it-IT', options).toUpperCase();

            const isoDate = today.toISOString().split('T')[0];
            document.getElementById('attendanceDate').value = isoDate;
            
            const monthStr = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthSelector').value = monthStr;
            document.getElementById('yearSelector').value = today.getFullYear().toString();
        }

        function populateTeamSelectors() {
            const teams = [...new Set(players.map(p => p.team))].sort((a,b) => {
                if (a === "DA ASSEGNARE") return -1;
                if (b === "DA ASSEGNARE") return 1;
                return a.localeCompare(b);
            });
            
            const teamSelect = document.getElementById('teamSelector');
            const historyTeamSelect = document.getElementById('historyTeamSelector');
            const rosterTeamSelect = document.getElementById('rosterTeamSelector');
            const teamOptions = document.getElementById('teamOptions');
            
            const currentAppello = teamSelect.value;
            const currentStorico = historyTeamSelect.value;
            const currentRoster = rosterTeamSelect ? rosterTeamSelect.value : 'ALL';

            teamSelect.innerHTML = '<option value="">Seleziona...</option>';
            historyTeamSelect.innerHTML = '<option value="ALL">Tutte le squadre</option>';
            if(rosterTeamSelect) rosterTeamSelect.innerHTML = '<option value="ALL">Tutte</option>';
            if(teamOptions) teamOptions.innerHTML = '';
            
            teams.forEach(team => {
                if(team.trim() === "") return;
                const opt = document.createElement('option');
                opt.value = team;
                opt.textContent = team === "DA ASSEGNARE" ? "⚠️ Da Assegnare" : team;
                teamSelect.appendChild(opt);
                
                const optHist = document.createElement('option');
                optHist.value = team;
                optHist.textContent = team;
                historyTeamSelect.appendChild(optHist);

                if(rosterTeamSelect) {
                    const optRoster = document.createElement('option');
                    optRoster.value = team;
                    optRoster.textContent = team === "DA ASSEGNARE" ? "⚠️ Da Asseg..." : team;
                    rosterTeamSelect.appendChild(optRoster);
                }

                if(teamOptions && team !== "DA ASSEGNARE") {
                    const dlOpt = document.createElement('option');
                    dlOpt.value = team;
                    teamOptions.appendChild(dlOpt);
                }
            });

            teamSelect.value = currentAppello || '';
            historyTeamSelect.value = currentStorico || 'ALL';
            if(rosterTeamSelect) rosterTeamSelect.value = currentRoster || 'ALL';
        }

        function setupEventListeners() {
            document.getElementById('teamSelector').addEventListener('change', renderAppelloList);
            document.getElementById('attendanceDate').addEventListener('change', renderAppelloList);
            
            document.getElementById('monthSelector').addEventListener('change', renderStorico);
            document.getElementById('yearSelector').addEventListener('change', renderStorico);
            document.getElementById('historyTeamSelector').addEventListener('change', renderStorico);

            document.getElementById('rosterTeamSelector').addEventListener('change', renderGiocatori);
            document.getElementById('playerSearchInput').addEventListener('input', renderGiocatori);
            document.getElementById('cameraInput').addEventListener('change', handlePhotoUpload);
        }

        window.markAttendance = async function(date, playerId, status) {
            // Optimistic Update
            if (!attendance[date]) attendance[date] = {};
            if (attendance[date][playerId] === status) {
                delete attendance[date][playerId];
            } else {
                attendance[date][playerId] = status;
            }
            renderAppelloList(); 

            try {
                await setDoc(doc(db, getAttendancePath(), date), { records: attendance[date] });
            } catch(e) {
                console.error("Cloud Error:", e);
                showToast("Errore di connessione", "error");
            }
        }

        window.markAllPresent = async function() {
            const team = document.getElementById('teamSelector').value;
            const date = document.getElementById('attendanceDate').value;
            if(!team || !date) return;

            const teamPlayers = players.filter(p => p.team === team);
            if (!attendance[date]) attendance[date] = {};

            teamPlayers.forEach(p => {
                attendance[date][p.id] = 'present';
            });
            renderAppelloList();

            try {
                await setDoc(doc(db, getAttendancePath(), date), { records: attendance[date] });
                showToast("Tutti segnati presenti!");
            } catch(e) {
                console.error("Cloud Error:", e);
            }
        }

        async function savePlayerToCloud(playerObj) {
            try {
                // If it's saved, it's no longer 'new' unless explicitly kept
                if(playerObj.team !== "DA ASSEGNARE") {
                    playerObj.isNew = false;
                }
                await setDoc(doc(db, getPlayersPath(), playerObj.id), playerObj);
                closePlayerModal();
                showToast("Giocatore salvato");
            } catch(e) {
                console.error("Save Error:", e);
            }
        }

        async function deletePlayerFromCloud(playerId) {
            if(confirm("Sei sicuro di voler eliminare questo giocatore?")) {
                try {
                     await deleteDoc(doc(db, getPlayersPath(), playerId));
                     closePlayerModal();
                     showToast("Giocatore eliminato");
                } catch(e) {
                    console.error("Delete Error:", e);
                }
            }
        }

        function getInitials(name, surname) {
            return ((name?.charAt(0) || '') + (surname?.charAt(0) || '')).toUpperCase();
        }

        function renderAppelloList() {
            const team = document.getElementById('teamSelector').value;
            const date = document.getElementById('attendanceDate').value;
            const container = document.getElementById('playersList');
            const controls = document.getElementById('appelloControls');
            
            container.innerHTML = '';

            if (!team || !date) {
                controls.classList.add('hidden');
                container.innerHTML = `
                    <div class="text-center text-gray-400 mt-12 py-12 bg-white rounded-2xl border border-gray-100 border-dashed">
                        <i class="fa-solid fa-users text-4xl mb-3 text-gray-200"></i>
                        <p class="font-medium text-sm">Seleziona una squadra</p>
                    </div>`;
                return;
            }

            controls.classList.remove('hidden');
            const teamPlayers = players.filter(p => p.team === team);
            if (!attendance[date]) attendance[date] = {};

            let pres = 0, abs = 0, none = 0;

            teamPlayers.forEach(player => {
                const status = attendance[date][player.id] || 'none';
                if(status === 'present') pres++;
                else if(status === 'absent') abs++;
                else none++;
                
                const card = document.createElement('div');
                card.className = 'bg-white p-3 rounded-2xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-gray-100 flex items-center gap-3 transition-colors';
                
                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm overflow-hidden flex-shrink-0 cursor-pointer shadow-inner';
                avatarDiv.onclick = () => window.openPhotoModal(player.id);
                
                if (player.photo) {
                    avatarDiv.innerHTML = `<img src="${player.photo}" class="avatar-img" alt="${player.name}">`;
                } else {
                    avatarDiv.innerHTML = getInitials(player.name, player.surname);
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex-1';
                infoDiv.innerHTML = `<p class="font-semibold text-gray-900 leading-tight">${player.surname} ${player.name}</p>`;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'flex gap-2';

                const btnPresent = document.createElement('button');
                btnPresent.className = `w-12 h-12 rounded-full border-2 flex items-center justify-center status-btn ${status === 'present' ? 'status-present shadow-lg shadow-green-500/30' : 'status-none hover:bg-gray-200'}`;
                btnPresent.innerHTML = '<i class="fa-solid fa-check text-lg"></i>';
                btnPresent.onclick = () => window.markAttendance(date, player.id, 'present');

                const btnAbsent = document.createElement('button');
                btnAbsent.className = `w-12 h-12 rounded-full border-2 flex items-center justify-center status-btn ${status === 'absent' ? 'status-absent shadow-lg shadow-red-500/30' : 'status-none hover:bg-gray-200'}`;
                btnAbsent.innerHTML = '<i class="fa-solid fa-xmark text-lg"></i>';
                btnAbsent.onclick = () => window.markAttendance(date, player.id, 'absent');

                actionsDiv.appendChild(btnPresent);
                actionsDiv.appendChild(btnAbsent);
                card.appendChild(avatarDiv);
                card.appendChild(infoDiv);
                card.appendChild(actionsDiv);
                container.appendChild(card);
            });

            document.getElementById('countPresent').innerText = pres;
            document.getElementById('countAbsent').innerText = abs;
            document.getElementById('countNone').innerText = none;
        }

        function renderStorico() {
            const month = document.getElementById('monthSelector').value;
            const year = document.getElementById('yearSelector').value;
            const teamFilter = document.getElementById('historyTeamSelector').value;
            const tbody = document.getElementById('historyTableBody');
            
            tbody.innerHTML = '';
            const targetPrefix = `${year}-${month}`;

            const targetPlayers = teamFilter === 'ALL' 
                ? players 
                : players.filter(p => p.team === teamFilter);

            targetPlayers.forEach(player => {
                let presences = 0;
                let absences = 0;

                Object.keys(attendance).forEach(date => {
                    if (date.startsWith(targetPrefix)) {
                        const status = attendance[date][player.id];
                        if (status === 'present') presences++;
                        if (status === 'absent') absences++;
                    }
                });

                const tr = document.createElement('tr');
                tr.className = 'bg-white border-b border-gray-50 last:border-0 hover:bg-blue-50/50 transition-colors';
                tr.innerHTML = `
                    <th scope="row" class="px-4 py-4 font-semibold text-gray-900 whitespace-nowrap">
                        ${player.surname} ${player.name}
                        ${teamFilter === 'ALL' ? `<br><span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${player.team}</span>` : ''}
                    </th>
                    <td class="px-4 py-4 text-center text-green-600 font-bold bg-green-50/30">${presences}</td>
                    <td class="px-4 py-4 text-center text-red-500 font-bold bg-red-50/30">${absences}</td>
                `;
                tbody.appendChild(tr);
            });
            
            if (targetPlayers.length === 0) {
                 tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-12 text-center text-gray-400 font-medium border-dashed border-t border-gray-200">Nessun giocatore trovato</td></tr>`;
            }
        }

        function renderGiocatori() {
            const teamFilter = document.getElementById('rosterTeamSelector').value;
            const searchQuery = (document.getElementById('playerSearchInput').value || '').toLowerCase();
            const container = document.getElementById('rosterList');
            container.innerHTML = '';

            let targetPlayers = teamFilter === 'ALL' 
                ? players 
                : players.filter(p => p.team === teamFilter);

            if (searchQuery) {
                targetPlayers = targetPlayers.filter(p => 
                    (p.name && p.name.toLowerCase().includes(searchQuery)) || 
                    (p.surname && p.surname.toLowerCase().includes(searchQuery))
                );
            }

            // Bring 'Da Assegnare' and 'New' to top
            targetPlayers.sort((a, b) => {
                if (a.isNew && !b.isNew) return -1;
                if (!a.isNew && b.isNew) return 1;
                if (a.team === "DA ASSEGNARE" && b.team !== "DA ASSEGNARE") return -1;
                if (a.team !== "DA ASSEGNARE" && b.team === "DA ASSEGNARE") return 1;
                return (a.surname||"").localeCompare(b.surname||"");
            });

            targetPlayers.forEach(player => {
                const card = document.createElement('div');
                const isDaAssegnare = player.team === "DA ASSEGNARE";
                
                card.className = `bg-white p-3 rounded-2xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border ${isDaAssegnare ? 'border-yellow-300 bg-yellow-50/30' : 'border-gray-100'} flex items-center gap-3 cursor-pointer hover:bg-gray-50 transition-colors relative overflow-hidden`;
                card.onclick = () => window.openPlayerModal(player.id);
                
                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-sm overflow-hidden flex-shrink-0 shadow-inner z-10';
                if (player.photo) {
                    avatarDiv.innerHTML = `<img src="${player.photo}" class="avatar-img" alt="${player.name}">`;
                } else {
                    avatarDiv.innerHTML = getInitials(player.name, player.surname);
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex-1 z-10';
                
                let entryDateStr = '';
                if(player.dataIscrizione) {
                    const d = new Date(player.dataIscrizione);
                    if(!isNaN(d)) entryDateStr = ` • ${d.toLocaleDateString('it-IT').slice(0,5)}`;
                }

                infoDiv.innerHTML = `
                    <div class="flex items-center gap-2">
                        <p class="font-bold text-gray-900 leading-tight">${player.surname} ${player.name}</p>
                        ${player.isNew ? '<span class="bg-yellow-400 text-yellow-900 text-[10px] font-bold px-1.5 py-0.5 rounded badge-new">NUOVO</span>' : ''}
                    </div>
                    <p class="text-xs font-semibold ${isDaAssegnare ? 'text-yellow-600' : 'text-blue-600'} mt-0.5">${player.team}${entryDateStr}</p>
                    ${player.genitore ? `<p class="text-[11px] text-gray-500 mt-0.5 font-medium"><i class="fa-solid fa-user-tie text-gray-400"></i> ${player.genitore}</p>` : ''}
                `;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'flex gap-2 z-10';

                if (player.telefono) {
                    let waPhone = player.telefono.replace(/\s+/g, '');
                    if (!waPhone.startsWith('+')) waPhone = '+39' + waPhone;

                    actionsDiv.innerHTML = `
                        <a href="tel:${player.telefono}" onclick="event.stopPropagation()" class="w-10 h-10 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center hover:bg-blue-100 shadow-sm transition-transform active:scale-95"><i class="fa-solid fa-phone"></i></a>
                        <a href="https://wa.me/${waPhone}" target="_blank" onclick="event.stopPropagation()" class="w-10 h-10 rounded-full bg-green-50 text-green-600 flex items-center justify-center hover:bg-green-100 shadow-sm transition-transform active:scale-95"><i class="fa-brands fa-whatsapp text-lg"></i></a>
                    `;
                } else {
                    actionsDiv.innerHTML = `<div class="w-10 h-10 flex items-center justify-center text-gray-300"><i class="fa-solid fa-chevron-right"></i></div>`;
                }

                card.appendChild(avatarDiv);
                card.appendChild(infoDiv);
                card.appendChild(actionsDiv);
                container.appendChild(card);
            });

            if (targetPlayers.length === 0) {
                 container.innerHTML = `<div class="text-center py-12 text-gray-400 font-medium">Nessun giocatore trovato</div>`;
            }
        }

        function renderSquadreDashboard() {
            const container = document.getElementById('teamsDashboardContainer');
            container.innerHTML = '';
            document.getElementById('totalPlayersBadge').innerText = `${players.length} Giocatori`;

            const teamsMap = {};
            players.forEach(p => {
                if(!teamsMap[p.team]) teamsMap[p.team] = [];
                teamsMap[p.team].push(p);
            });

            const sortedTeams = Object.keys(teamsMap).sort((a,b) => {
                if (a === "DA ASSEGNARE") return -1;
                if (b === "DA ASSEGNARE") return 1;
                return a.localeCompare(b);
            });

            sortedTeams.forEach(teamName => {
                const teamRoster = teamsMap[teamName];
                const isDaAssegnare = teamName === "DA ASSEGNARE";
                
                const card = document.createElement('div');
                card.className = `bg-white p-4 rounded-3xl shadow-[0_4px_20px_-5px_rgba(0,0,0,0.05)] border ${isDaAssegnare ? 'border-yellow-300' : 'border-gray-100'}`;
                
                let avatarsHtml = '';
                const maxDisplay = 8;
                
                teamRoster.slice(0, maxDisplay).forEach((p, idx) => {
                    if(p.photo) {
                        avatarsHtml += `<div class="w-10 h-10 rounded-full bg-gray-100 border-2 border-white shadow-sm overflow-hidden z-[${maxDisplay-idx}] -ml-3 first:ml-0"><img src="${p.photo}" class="avatar-img"></div>`;
                    } else {
                        avatarsHtml += `<div class="w-10 h-10 rounded-full bg-blue-100 text-blue-700 border-2 border-white shadow-sm flex items-center justify-center text-xs font-bold z-[${maxDisplay-idx}] -ml-3 first:ml-0">${getInitials(p.name, p.surname)}</div>`;
                    }
                });

                if(teamRoster.length > maxDisplay) {
                    avatarsHtml += `<div class="w-10 h-10 rounded-full bg-gray-50 text-gray-500 border-2 border-white shadow-sm flex items-center justify-center text-xs font-bold z-0 -ml-3">+${teamRoster.length - maxDisplay}</div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="font-bold text-gray-900 ${isDaAssegnare ? 'text-yellow-600' : ''}">${isDaAssegnare ? '⚠️ DA ASSEGNARE' : teamName}</h3>
                        <span class="bg-gray-100 text-gray-600 text-xs font-bold px-2.5 py-1 rounded-full">${teamRoster.length}</span>
                    </div>
                    <div class="flex items-center pt-2">
                        ${avatarsHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.switchTab = function(tab) {
            const views = ['viewAppello', 'viewStorico', 'viewGiocatori', 'viewSquadre'];
            const tabs = ['tabAppello', 'tabStorico', 'tabGiocatori', 'tabSquadre'];

            views.forEach(v => document.getElementById(v).classList.add('hidden'));
            
            const inactiveClass = 'flex-1 py-3 flex flex-col items-center justify-center gap-1 tab-inactive focus:outline-none transition-colors relative';
            const activeClass = 'flex-1 py-3 flex flex-col items-center justify-center gap-1 tab-active focus:outline-none transition-colors relative';
            
            tabs.forEach(t => document.getElementById(t).className = inactiveClass);

            if (tab === 'appello') {
                document.getElementById('viewAppello').classList.remove('hidden');
                document.getElementById('tabAppello').className = activeClass;
            } else if (tab === 'storico') {
                document.getElementById('viewStorico').classList.remove('hidden');
                document.getElementById('tabStorico').className = activeClass;
                renderStorico();
            } else if (tab === 'giocatori') {
                document.getElementById('viewGiocatori').classList.remove('hidden');
                document.getElementById('tabGiocatori').className = activeClass;
                renderGiocatori();
            } else if (tab === 'squadre') {
                document.getElementById('viewSquadre').classList.remove('hidden');
                document.getElementById('tabSquadre').className = activeClass;
                renderSquadreDashboard();
            }
        };

        window.openPlayerModal = function(playerId = null) {
            const modal = document.getElementById('playerModal');
            const title = document.getElementById('playerModalTitle');
            const form = document.getElementById('playerForm');
            const deleteBtn = document.getElementById('deletePlayerBtn');

            form.reset();

            if (playerId) {
                const player = players.find(p => p.id === playerId);
                if(!player) return;
                
                title.textContent = 'Modifica Giocatore';
                document.getElementById('editPlayerId').value = player.id;
                document.getElementById('editPlayerIsNew').value = player.isNew ? 'true' : 'false';
                document.getElementById('playerName').value = player.name || '';
                document.getElementById('playerSurname').value = player.surname || '';
                document.getElementById('playerTeam').value = player.team || '';
                document.getElementById('playerGenitore').value = player.genitore || '';
                document.getElementById('playerPhone').value = player.telefono || '';
                document.getElementById('playerBirth').value = player.dataNascita || '';
                document.getElementById('playerEntry').value = player.dataIscrizione || '';
                
                deleteBtn.classList.remove('hidden');
            } else {
                title.textContent = 'Aggiungi Giocatore';
                document.getElementById('editPlayerId').value = '';
                document.getElementById('editPlayerIsNew').value = 'false';
                document.getElementById('playerEntry').value = new Date().toISOString().split('T')[0]; 
                deleteBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
            // Animate in
            setTimeout(() => { modal.firstElementChild.style.transform = 'translateY(0)'; }, 10);
        };

        window.closePlayerModal = function() {
            document.getElementById('playerModal').classList.add('hidden');
        };

        window.savePlayer = function(e) {
            e.preventDefault();
            
            const id = document.getElementById('editPlayerId').value;
            const isNewStr = document.getElementById('editPlayerIsNew').value;
            const name = document.getElementById('playerName').value.trim();
            const surname = document.getElementById('playerSurname').value.trim();
            const team = document.getElementById('playerTeam').value.trim().toUpperCase();
            const genitore = document.getElementById('playerGenitore').value.trim();
            const phone = document.getElementById('playerPhone').value.trim();
            const birth = document.getElementById('playerBirth').value;
            const entry = document.getElementById('playerEntry').value;

            if(!name || !surname || !team) return;

            let playerObj;
            if (id) {
                const existing = players.find(p => p.id === id);
                playerObj = {
                    ...existing,
                    name: name,
                    surname: surname,
                    team: team,
                    genitore: genitore,
                    telefono: phone,
                    dataNascita: birth,
                    dataIscrizione: entry,
                    isNew: isNewStr === 'true'
                };
            } else {
                playerObj = {
                    id: 'p' + Date.now(),
                    name: name,
                    surname: surname,
                    team: team,
                    genitore: genitore,
                    telefono: phone,
                    dataNascita: birth,
                    dataIscrizione: entry,
                    photo: null,
                    isNew: false
                };
            }
            savePlayerToCloud(playerObj);
        };

        window.deletePlayer = function() {
            const id = document.getElementById('editPlayerId').value;
            if(!id) return;
            deletePlayerFromCloud(id);
        };

        window.openPhotoModal = function(playerId) {
            currentEditingPlayerId = playerId;
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            document.getElementById('modalPlayerName').textContent = `${player.name} ${player.surname}`;
            document.getElementById('modalPlayerTeam').textContent = player.team;
            
            const previewImg = document.getElementById('modalPreviewImg');
            const previewIcon = document.getElementById('modalPreviewIcon');

            if (player.photo) {
                previewImg.src = player.photo;
                previewImg.classList.remove('hidden');
                previewIcon.classList.add('hidden');
                removeBtn.classList.remove('hidden');
            } else {
                previewImg.src = '';
                previewImg.classList.add('hidden');
                previewIcon.classList.remove('hidden');
                removeBtn.classList.add('hidden');
            }

            document.getElementById('photoModal').classList.remove('hidden');
        };

        window.closePhotoModal = function() {
            document.getElementById('photoModal').classList.add('hidden');
            currentEditingPlayerId = null;
        };

        window.removePhoto = function() {
            if (!currentEditingPlayerId) return;
            const player = players.find(p => p.id === currentEditingPlayerId);
            if (player) {
                player.photo = null;
                savePlayerToCloud(player);
                window.closePhotoModal();
            }
        };

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file || !currentEditingPlayerId) return;

            document.getElementById('modalPreviewIcon').className = "fa-solid fa-spinner fa-spin text-4xl text-blue-500";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('compressCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    const MAX_WIDTH = 200; 
                    const MAX_HEIGHT = 200;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

                    const player = players.find(p => p.id === currentEditingPlayerId);
                    if (player) {
                        player.photo = dataUrl;
                        savePlayerToCloud(player).then(() => {
                            window.closePhotoModal();
                        });
                    }
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.exportToCSV = function() {
            const month = document.getElementById('monthSelector').options[document.getElementById('monthSelector').selectedIndex].text;
            const year = document.getElementById('yearSelector').value;
            const team = document.getElementById('historyTeamSelector').options[document.getElementById('historyTeamSelector').selectedIndex].text;
            
            const tbody = document.getElementById('historyTableBody');
            const rows = tbody.querySelectorAll('tr');
            
            if (rows.length === 0 || (rows.length === 1 && rows[0].innerText.includes('Nessun giocatore'))) {
                showToast("Nessun dato da esportare", "error");
                return;
            }

            let csvContent = "\uFEFFGiocatore;Squadra;Presenze;Assenze\n";

            rows.forEach(row => {
                const cols = row.querySelectorAll('th, td');
                if(cols.length === 3) {
                    let nameCell = cols[0].innerHTML.replace(/<br>/g, '|').replace(/<[^>]+>/g, '').trim();
                    let name = nameCell.split('|')[0].trim();
                    let playerTeam = nameCell.split('|')[1] ? nameCell.split('|')[1].trim() : team;
                    
                    let presenze = cols[1].innerText.trim();
                    let assenze = cols[2].innerText.trim();
                    
                    csvContent += `"${name}";"${playerTeam}";${presenze};${assenze}\n`;
                }
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Presenze_${team.replace(/\s+/g, '_')}_${month}_${year}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("Esportazione completata");
        };
