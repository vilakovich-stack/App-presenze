<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestione Presenze Giocatori</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: 600; }
        .tab-inactive { color: #6b7280; font-weight: 400; }
        .avatar-img { object-fit: cover; width: 100%; height: 100%; border-radius: 50%; }
        
        /* Toggle Switch Styles */
        .status-btn { transition: all 0.2s ease-in-out; }
        .status-present { background-color: #10b981; color: white; border-color: #10b981; }
        .status-absent { background-color: #ef4444; color: white; border-color: #ef4444; }
        .status-none { background-color: #e5e7eb; color: #6b7280; border-color: #d1d5db; }
        
        /* Hide scrollbar for clean mobile look */
        ::-webkit-scrollbar { display: none; }

        /* Cloud Sync Banner */
        #cloudSyncBanner { transition: top 0.3s ease-in-out; }
        .banner-visible { top: 0; }
        .banner-hidden { top: -50px; }
    </style>
</head>
<body class="text-gray-800 flex flex-col h-screen overflow-hidden relative">

    <!-- Cloud Sync Status Banner -->
    <div id="cloudSyncBanner" class="fixed left-0 w-full bg-yellow-500 text-white text-xs font-bold text-center py-1 z-50 banner-visible shadow-md flex justify-center items-center gap-2">
        <i class="fa-solid fa-cloud-arrow-up animate-bounce"></i> <span id="syncText">Connessione al database...</span>
    </div>

    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-md z-10 p-4 pt-8">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-clipboard-user"></i> Presenze 26/27
            </h1>
            <div id="currentDateDisplay" class="text-sm font-medium opacity-90"></div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto pb-20 w-full max-w-3xl mx-auto" id="mainContainer">
        
        <!-- View 1: Appello (Roll Call) -->
        <div id="viewAppello" class="p-4 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                <label class="block text-sm font-semibold text-gray-600 mb-1">Seleziona Squadra</label>
                <select id="teamSelector" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                    <option value="">Caricamento...</option>
                </select>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between">
                <label class="block text-sm font-semibold text-gray-600">Data Appello</label>
                <input type="date" id="attendanceDate" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2">
            </div>

            <!-- Players List -->
            <div id="playersList" class="space-y-3 mt-4">
                <div class="text-center text-gray-500 mt-10 py-10">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 text-gray-300"></i>
                    <p>Caricamento giocatori...</p>
                </div>
            </div>
        </div>

        <!-- View 2: Storico (History) -->
        <div id="viewStorico" class="p-4 space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Mese</label>
                    <select id="monthSelector" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2">
                        <option value="01">Gennaio</option>
                        <option value="02">Febbraio</option>
                        <option value="03">Marzo</option>
                        <option value="04">Aprile</option>
                        <option value="05">Maggio</option>
                        <option value="06">Giugno</option>
                        <option value="07">Luglio</option>
                        <option value="08">Agosto</option>
                        <option value="09">Settembre</option>
                        <option value="10">Ottobre</option>
                        <option value="11">Novembre</option>
                        <option value="12">Dicembre</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Anno</label>
                    <select id="yearSelector" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2">
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
                <div class="col-span-2">
                     <label class="block text-sm font-semibold text-gray-600 mb-1">Filtra per Squadra</label>
                     <div class="flex gap-2">
                         <select id="historyTeamSelector" class="flex-1 bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg p-2">
                            <option value="ALL">Tutte le squadre</option>
                         </select>
                         <button onclick="exportToCSV()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 transition-colors shadow-sm">
                             <i class="fa-solid fa-file-csv"></i> Esporta
                         </button>
                     </div>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left text-gray-500">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b">
                            <tr>
                                <th scope="col" class="px-4 py-3">Giocatore</th>
                                <th scope="col" class="px-4 py-3 text-center text-green-600"><i class="fa-solid fa-check"></i> Presenze</th>
                                <th scope="col" class="px-4 py-3 text-center text-red-600"><i class="fa-solid fa-xmark"></i> Assenze</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- View 3: Giocatori (Roster / Add new) -->
        <div id="viewGiocatori" class="p-4 space-y-4 hidden">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-bold text-gray-800">Anagrafica Giocatori</h2>
                <button onclick="openPlayerModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-xl shadow-sm transition-colors flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Nuovo
                </button>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 space-y-3">
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Filtra per Squadra</label>
                    <select id="rosterTeamSelector" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                        <option value="ALL">Tutte le squadre</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Cerca Giocatore</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                            <i class="fa-solid fa-search text-gray-400"></i>
                        </div>
                        <input type="text" id="playerSearchInput" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-base rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full pl-10 p-2.5" placeholder="Nome o cognome...">
                    </div>
                </div>
            </div>

            <div id="rosterList" class="space-y-3 mt-4 pb-4">
                <!-- Populated by JS -->
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 w-full bg-white border-t border-gray-200 z-10 pb-safe">
        <div class="max-w-3xl mx-auto flex">
            <button onclick="switchTab('appello')" id="tabAppello" class="flex-1 py-4 flex flex-col items-center justify-center gap-1 tab-active focus:outline-none">
                <i class="fa-solid fa-list-check text-xl"></i>
                <span class="text-xs">Appello</span>
            </button>
            <button onclick="switchTab('storico')" id="tabStorico" class="flex-1 py-4 flex flex-col items-center justify-center gap-1 tab-inactive focus:outline-none">
                <i class="fa-solid fa-chart-pie text-xl"></i>
                <span class="text-xs">Storico</span>
            </button>
            <button onclick="switchTab('giocatori')" id="tabGiocatori" class="flex-1 py-4 flex flex-col items-center justify-center gap-1 tab-inactive focus:outline-none">
                <i class="fa-solid fa-users text-xl"></i>
                <span class="text-xs">Giocatori</span>
            </button>
        </div>
    </nav>

    <!-- Photo Modal -->
    <div id="photoModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">

                <button onclick="closePhotoModal()" class="text-gray-400 hover:text-gray-700">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>

            <p class="text-sm text-gray-500 mb-6" id="modalPlayerTeam">Squadra</p>

                <img id="modalPreviewImg" class="avatar-img hidden" src="" alt="Preview">
                <i id="modalPreviewIcon" class="fa-solid fa-camera text-4xl text-gray-400"></i>
            </div>
            
            <div class="w-full space-y-3">
                <label for="cameraInput" class="w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl cursor-pointer transition-colors">
                    <i class="fa-solid fa-camera"></i>
                    Scatta / Scegli Foto
                </label>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">

                    <i class="fa-solid fa-trash-can"></i>
                    Rimuovi Foto
                </button>
            </div>
        </div>
    </div>

    <!-- Hidden Canvas for Image Compression -->
    <canvas id="compressCanvas" class="hidden"></canvas>

    <!-- Player Form Modal -->
    <div id="playerModal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-md p-6 shadow-xl transform transition-all flex flex-col max-h-[90vh] overflow-y-auto">
            <div class="w-full flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-gray-900" id="playerModalTitle">Aggiungi Giocatore</h3>
                <button onclick="closePlayerModal()" class="text-gray-400 hover:text-gray-700">
                    <i class="fa-solid fa-times text-xl"></i>
                </button>
            </div>
            
            <form id="playerForm" class="space-y-4" onsubmit="savePlayer(event)">
                <input type="hidden" id="editPlayerId">
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Nome *</label>
                        <input type="text" id="playerName" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Cognome *</label>
                        <input type="text" id="playerSurname" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Squadra *</label>
                    <input type="text" id="playerTeam" required list="teamOptions" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Seleziona o scrivi...">
                    <datalist id="teamOptions"></datalist>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">Telefono (Contatto)</label>
                    <input type="tel" id="playerPhone" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Es. 333 1234567">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Data Nascita</label>
                        <input type="date" id="playerBirth" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-600 mb-1">Data Iscrizione</label>
                        <input type="date" id="playerEntry" required class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>

                <div class="pt-4 flex gap-3">
                    <button type="button" id="deletePlayerBtn" onclick="deletePlayer()" class="hidden flex-1 bg-red-100 text-red-600 font-semibold py-3 rounded-xl hover:bg-red-200 transition-colors">Elimina</button>
                    <button type="submit" class="flex-1 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 transition-colors">Salva nel Cloud</button>
                </div>
            </form>
        </div>
    </div>

        window.onload = async () => {
            initUI();
            setupEventListeners();
            
            try {
                // Iniciar sesión anónima en tu Firebase
                await signInAnonymously(auth);
                initCloudData();
            } catch (error) {
                console.error("Auth Error:", error);
                document.getElementById('syncText').textContent = "Errore di connessione. Verifica le regole di sicurezza (Test Mode).";
                document.getElementById('cloudSyncBanner').classList.replace('bg-yellow-500', 'bg-red-500');

        // Rutas fijas para tu base de datos
        const getPlayersPath = () => `players`; 
        const getAttendancePath = () => `attendance`; 

        function initCloudData() {
            // Listen for Players Collection
            onSnapshot(collection(db, getPlayersPath()), async (snapshot) => {
                if (snapshot.empty && players.length === 0) {
                    // Seed initial data if cloud is empty
                    for (const p of initialData) {
                        const pData = { ...p, photo: null, dataIscrizione: '2026-09-01' };
                        await setDoc(doc(db, getPlayersPath(), p.id), pData);
                    }
                } else {
                    players = [];
                    snapshot.forEach(doc => {
                        players.push(doc.data());
                    });
                    populateTeamSelectors();
                    renderViews();
                    hideSyncBanner();
                }
            }, (error) => {
                console.error("Error listening to players: ", error);
            });

            // Listen for Attendance Collection
            onSnapshot(collection(db, getAttendancePath()), async (snapshot) => {
                 if (!snapshot.empty) {
                     attendance = {};
                     snapshot.forEach(doc => {
                         attendance[doc.id] = doc.data().records || {};
                     });
                     renderViews();
                 }
            }, (error) => {
                 console.error("Error listening to attendance: ", error);
            });
        }

        function hideSyncBanner() {
            const banner = document.getElementById('cloudSyncBanner');
            banner.classList.replace('banner-visible', 'banner-hidden');
        }

        function renderViews() {
            if (!document.getElementById('viewAppello').classList.contains('hidden')) renderAppelloList();
            if (!document.getElementById('viewStorico').classList.contains('hidden')) renderStorico();
            if (!document.getElementById('viewGiocatori').classList.contains('hidden')) renderGiocatori();
        }

        function initUI() {
            const today = new Date();
            const options = { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('currentDateDisplay').textContent = today.toLocaleDateString('it-IT', options);

            const isoDate = today.toISOString().split('T')[0];
            document.getElementById('attendanceDate').value = isoDate;
            
            const monthStr = String(today.getMonth() + 1).padStart(2, '0');
            document.getElementById('monthSelector').value = monthStr;
            document.getElementById('yearSelector').value = today.getFullYear().toString();
        }

        function populateTeamSelectors() {
            const teams = [...new Set(players.map(p => p.team))].sort();
            
            const teamSelect = document.getElementById('teamSelector');
            const historyTeamSelect = document.getElementById('historyTeamSelector');
            const rosterTeamSelect = document.getElementById('rosterTeamSelector');
            const teamOptions = document.getElementById('teamOptions');
            
            const currentAppello = teamSelect.value;
            const currentStorico = historyTeamSelect.value;
            const currentRoster = rosterTeamSelect ? rosterTeamSelect.value : 'ALL';

            teamSelect.innerHTML = '<option value="">Seleziona...</option>';
            historyTeamSelect.innerHTML = '<option value="ALL">Tutte le squadre</option>';
            if(rosterTeamSelect) rosterTeamSelect.innerHTML = '<option value="ALL">Tutte le squadre</option>';
            if(teamOptions) teamOptions.innerHTML = '';
            
            teams.forEach(team => {
                const opt = document.createElement('option');
                opt.value = team;
                opt.textContent = team;
                teamSelect.appendChild(opt);
                
                const optHist = document.createElement('option');
                optHist.value = team;
                optHist.textContent = team;
                historyTeamSelect.appendChild(optHist);

                if(rosterTeamSelect) {
                    const optRoster = document.createElement('option');
                    optRoster.value = team;
                    optRoster.textContent = team;
                    rosterTeamSelect.appendChild(optRoster);
                }

                if(teamOptions) {
                    const dlOpt = document.createElement('option');
                    dlOpt.value = team;
                    teamOptions.appendChild(dlOpt);
                }
            });

            teamSelect.value = currentAppello || '';
            historyTeamSelect.value = currentStorico || 'ALL';
            if(rosterTeamSelect) rosterTeamSelect.value = currentRoster || 'ALL';
        }

        function setupEventListeners() {
            document.getElementById('teamSelector').addEventListener('change', renderAppelloList);
            document.getElementById('attendanceDate').addEventListener('change', renderAppelloList);
            
            document.getElementById('monthSelector').addEventListener('change', renderStorico);
            document.getElementById('yearSelector').addEventListener('change', renderStorico);
            document.getElementById('historyTeamSelector').addEventListener('change', renderStorico);

            document.getElementById('rosterTeamSelector').addEventListener('change', renderGiocatori);
            document.getElementById('playerSearchInput').addEventListener('input', renderGiocatori);
            document.getElementById('cameraInput').addEventListener('change', handlePhotoUpload);
        }

        async function markAttendance(date, playerId, status) {
            // Optimistic UI Update for immediate feedback
            if (!attendance[date]) attendance[date] = {};
            if (attendance[date][playerId] === status) {
                delete attendance[date][playerId];
            } else {
                attendance[date][playerId] = status;
            }
            renderAppelloList(); 

            // Save to Cloud
            try {
                await setDoc(doc(db, getAttendancePath(), date), { records: attendance[date] });
            } catch(e) {
                console.error("Cloud Error:", e);
                alert("Errore di sincronizzazione"); 
            }
        }

        async function savePlayerToCloud(playerObj) {
            try {
                await setDoc(doc(db, getPlayersPath(), playerObj.id), playerObj);
                closePlayerModal();
            } catch(e) {
                console.error("Save Error:", e);
            }
        }

        async function deletePlayerFromCloud(playerId) {
            try {
                 await deleteDoc(doc(db, getPlayersPath(), playerId));
                 closePlayerModal();
            } catch(e) {
                console.error("Delete Error:", e);
            }
        }

        function getInitials(name, surname) {
            return (name.charAt(0) + surname.charAt(0)).toUpperCase();
        }

        function renderAppelloList() {
            const team = document.getElementById('teamSelector').value;
            const date = document.getElementById('attendanceDate').value;
            const container = document.getElementById('playersList');
            
            container.innerHTML = '';

            if (!team || !date) {
                container.innerHTML = `
                    <div class="text-center text-gray-500 mt-10 py-10">
                        <i class="fa-solid fa-users text-4xl mb-3 text-gray-300"></i>
                        <p>Seleziona una squadra per iniziare l'appello.</p>
                    </div>`;
                return;
            }

            const teamPlayers = players.filter(p => p.team === team);
            if (!attendance[date]) attendance[date] = {};

            teamPlayers.forEach(player => {
                const status = attendance[date][player.id] || 'none';
                
                const card = document.createElement('div');
                card.className = 'bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex items-center gap-3';
                
                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'w-12 h-12 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold text-sm overflow-hidden flex-shrink-0 border-2 border-transparent active:border-blue-400 cursor-pointer';
                avatarDiv.onclick = () => window.openPhotoModal(player.id);
                
                if (player.photo) {
                    avatarDiv.innerHTML = `<img src="${player.photo}" class="avatar-img" alt="${player.name}">`;
                } else {
                    avatarDiv.innerHTML = getInitials(player.name, player.surname);
                }

                const infoDiv = document.createElement('div');
                infoDiv.className = 'flex-1';
                infoDiv.innerHTML = `<p class="font-semibold text-gray-800 leading-tight">${player.surname} ${player.name}</p>`;

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'flex gap-2';

                const btnPresent = document.createElement('button');
                btnPresent.className = `w-10 h-10 rounded-full border flex items-center justify-center status-btn ${status === 'present' ? 'status-present shadow-md' : 'status-none hover:bg-gray-200'}`;
                btnPresent.innerHTML = '<i class="fa-solid fa-check"></i>';
                btnPresent.onclick = () => markAttendance(date, player.id, 'present');

                const btnAbsent = document.createElement('button');
                btnAbsent.className = `w-10 h-10 rounded-full border flex items-center justify-center status-btn ${status === 'absent' ? 'status-absent shadow-md' : 'status-none hover:bg-gray-200'}`;
                btnAbsent.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                btnAbsent.onclick = () => markAttendance(date, player.id, 'absent');

                actionsDiv.appendChild(btnPresent);
                actionsDiv.appendChild(btnAbsent);
                card.appendChild(avatarDiv);
                card.appendChild(infoDiv);
                card.appendChild(actionsDiv);
                container.appendChild(card);
            });
        }

        function renderStorico() {
            const month = document.getElementById('monthSelector').value;
            const year = document.getElementById('yearSelector').value;
            const teamFilter = document.getElementById('historyTeamSelector').value;
            const tbody = document.getElementById('historyTableBody');
            
            tbody.innerHTML = '';
            const targetPrefix = `${year}-${month}`;

            const targetPlayers = teamFilter === 'ALL' 
                ? players 
                : players.filter(p => p.team === teamFilter);

            targetPlayers.forEach(player => {
                let presences = 0;
                let absences = 0;

                Object.keys(attendance).forEach(date => {
                    if (date.startsWith(targetPrefix)) {
                        const status = attendance[date][player.id];
                        if (status === 'present') presences++;
                        if (status === 'absent') absences++;
                    }
                });

                const tr = document.createElement('tr');
                tr.className = 'bg-white border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <th scope="row" class="px-4 py-3 font-medium text-gray-900 whitespace-nowrap">
                        ${player.surname} ${player.name}
                        ${teamFilter === 'ALL' ? `<br><span class="text-xs text-gray-400 font-normal">${player.team}</span>` : ''}
                    </th>
                    <td class="px-4 py-3 text-center text-green-600 font-bold bg-green-50/30">${presences}</td>
                    <td class="px-4 py-3 text-center text-red-600 font-bold bg-red-50/30">${absences}</td>
                `;
                tbody.appendChild(tr);
            });
            
            if (targetPlayers.length === 0) {
                 tbody.innerHTML = `<tr><td colspan="3" class="px-4 py-8 text-center text-gray-500">Nessun giocatore trovato</td></tr>`;
            }
        }

                if (player.photo) {

                } else {

                card.appendChild(avatarDiv);

            if (targetPlayers.length === 0) {
                 container.innerHTML = `<div class="text-center py-8 text-gray-500">Nessun giocatore trovato</div>`;

        window.switchTab = function(tab) {
            const vAppello = document.getElementById('viewAppello');
            const vStorico = document.getElementById('viewStorico');
            const vGiocatori = document.getElementById('viewGiocatori');
            const tAppello = document.getElementById('tabAppello');
            const tStorico = document.getElementById('tabStorico');
            const tGiocatori = document.getElementById('tabGiocatori');

            vAppello.classList.add('hidden');
            vStorico.classList.add('hidden');
            vGiocatori.classList.add('hidden');
            
            const inactiveClass = 'flex-1 py-4 flex flex-col items-center justify-center gap-1 tab-inactive focus:outline-none';
            const activeClass = 'flex-1 py-4 flex flex-col items-center justify-center gap-1 tab-active focus:outline-none';
            
            tAppello.className = inactiveClass;
            tStorico.className = inactiveClass;
            tGiocatori.className = inactiveClass;

            if (tab === 'appello') {
                vAppello.classList.remove('hidden');
                tAppello.className = activeClass;
            } else if (tab === 'storico') {
                vStorico.classList.remove('hidden');
                tStorico.className = activeClass;
                renderStorico();
            } else if (tab === 'giocatori') {
                vGiocatori.classList.remove('hidden');
                tGiocatori.className = activeClass;
                renderGiocatori();
            }
        };

        window.openPlayerModal = function(playerId = null) {
            const modal = document.getElementById('playerModal');
            const title = document.getElementById('playerModalTitle');
            const form = document.getElementById('playerForm');
            const deleteBtn = document.getElementById('deletePlayerBtn');

            form.reset();

            if (playerId) {
                const player = players.find(p => p.id === playerId);
                if(!player) return;
                
                title.textContent = 'Modifica Giocatore';
                document.getElementById('editPlayerId').value = player.id;
                document.getElementById('playerName').value = player.name;
                document.getElementById('playerSurname').value = player.surname;
                document.getElementById('playerTeam').value = player.team;
                document.getElementById('playerPhone').value = player.telefono || '';
                document.getElementById('playerBirth').value = player.dataNascita || '';
                document.getElementById('playerEntry').value = player.dataIscrizione || '';
                
                deleteBtn.classList.remove('hidden');
            } else {
                title.textContent = 'Aggiungi Giocatore';
                document.getElementById('editPlayerId').value = '';
                document.getElementById('playerEntry').value = new Date().toISOString().split('T')[0]; 
                deleteBtn.classList.add('hidden');
            }

            modal.classList.remove('hidden');
        };

        window.closePlayerModal = function() {
            document.getElementById('playerModal').classList.add('hidden');
        };

        window.savePlayer = function(e) {
            e.preventDefault();
            
            const id = document.getElementById('editPlayerId').value;
            const name = document.getElementById('playerName').value.trim();
            const surname = document.getElementById('playerSurname').value.trim();
            const team = document.getElementById('playerTeam').value.trim().toUpperCase();
            const phone = document.getElementById('playerPhone').value.trim();
            const birth = document.getElementById('playerBirth').value;
            const entry = document.getElementById('playerEntry').value;

            if(!name || !surname || !team) return;

            let playerObj;
            if (id) {
                const existing = players.find(p => p.id === id);
                playerObj = {
                    ...existing,
                    name: name,
                    surname: surname,
                    team: team,
                    telefono: phone,
                    dataNascita: birth,
                    dataIscrizione: entry
                };
            } else {
                playerObj = {
                    id: 'p' + Date.now(),
                    name: name,
                    surname: surname,
                    team: team,
                    telefono: phone,
                    dataNascita: birth,
                    dataIscrizione: entry,
                    photo: null
                };
            }
            // Start Cloud Save
            savePlayerToCloud(playerObj);
        };

        window.deletePlayer = function() {
            const id = document.getElementById('editPlayerId').value;
            if(!id) return;
            deletePlayerFromCloud(id);
        };

        window.openPhotoModal = function(playerId) {
            currentEditingPlayerId = playerId;
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            document.getElementById('modalPlayerName').textContent = `${player.name} ${player.surname}`;
            document.getElementById('modalPlayerTeam').textContent = player.team;
            
            const previewImg = document.getElementById('modalPreviewImg');
            const previewIcon = document.getElementById('modalPreviewIcon');
            const removeBtn = document.getElementById('removePhotoBtn');

            if (player.photo) {
                previewImg.src = player.photo;
                previewImg.classList.remove('hidden');
                previewIcon.classList.add('hidden');
                removeBtn.classList.remove('hidden');
            } else {
                previewImg.src = '';
                previewImg.classList.add('hidden');
                previewIcon.classList.remove('hidden');
                removeBtn.classList.add('hidden');
            }

            document.getElementById('photoModal').classList.remove('hidden');
        };

        window.closePhotoModal = function() {
            document.getElementById('photoModal').classList.add('hidden');
            currentEditingPlayerId = null;
        };

        window.removePhoto = function() {
            if (!currentEditingPlayerId) return;
            const player = players.find(p => p.id === currentEditingPlayerId);
            if (player) {
                player.photo = null;
                savePlayerToCloud(player);
                window.closePhotoModal();
            }
        };

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file || !currentEditingPlayerId) return;

            // Show loading state on modal
            document.getElementById('modalPreviewIcon').className = "fa-solid fa-spinner fa-spin text-4xl text-blue-500";
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('compressCanvas');
                    const ctx = canvas.getContext('2d');
                    
                    // Very aggressive compression for Cloud Database 
                    const MAX_WIDTH = 150; 
                    const MAX_HEIGHT = 150;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    // High compression (0.6 quality) to keep string < 15kb
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);

                    const player = players.find(p => p.id === currentEditingPlayerId);
                    if (player) {
                        player.photo = dataUrl;
                        savePlayerToCloud(player).then(() => {
                            window.closePhotoModal();
                        });
                    }
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.exportToCSV = function() {
            const month = document.getElementById('monthSelector').options[document.getElementById('monthSelector').selectedIndex].text;
            const year = document.getElementById('yearSelector').value;
            const team = document.getElementById('historyTeamSelector').options[document.getElementById('historyTeamSelector').selectedIndex].text;
            
            const tbody = document.getElementById('historyTableBody');
            const rows = tbody.querySelectorAll('tr');
            
            if (rows.length === 0 || (rows.length === 1 && rows[0].innerText.includes('Nessun giocatore'))) {
                return;
            }

            let csvContent = "\uFEFFGiocatore;Squadra;Presenze;Assenze\n";

            rows.forEach(row => {
                const cols = row.querySelectorAll('th, td');
                if(cols.length === 3) {
                    let nameCell = cols[0].innerHTML.replace(/<br>/g, '|').replace(/<[^>]+>/g, '').trim();
                    let name = nameCell.split('|')[0].trim();
                    let playerTeam = nameCell.split('|')[1] ? nameCell.split('|')[1].trim() : team;
                    
                    let presenze = cols[1].innerText.trim();
                    let assenze = cols[2].innerText.trim();
                    
                    csvContent += `"${name}";"${playerTeam}";${presenze};${assenze}\n`;
                }
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Presenze_${team.replace(/\s+/g, '_')}_${month}_${year}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };
